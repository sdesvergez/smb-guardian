# ==========================================================
# Configuration du service de surveillance du montage SMB
# (NAS Unifi Pro)
# ==========================================================
# Ce fichier est charge par smb-guardian.sh (via `source`).
# Modifiez les valeurs ci-dessous puis relancez le service :
#   launchctl kickstart -k gui/$(id -u)/eu.devrg.smbguardian

# Nom d'hote ou adresse IP du NAS Unifi (ex: "unifi-nas.local" ou "192.168.1.50")
NAS_HOST="unifi-nas.local"

# Nom exact du partage SMB a monter
SMB_SHARE="backup"

# Utilisateur SMB - doit correspondre exactement au compte enregistre
# dans le Trousseau (Keychain), voir le README pour la procedure
SMB_USER="simon"

# Point de montage local (le dossier est cree automatiquement s'il n'existe pas)
MOUNT_POINT="$HOME/NAS-Unifi"

# Intervalle de verification en secondes (verification periodique)
CHECK_INTERVAL=30

# Nombre de tentatives de remontage avant abandon temporaire
MAX_RETRIES=3

# Delai en secondes entre deux tentatives de remontage
RETRY_DELAY=10

# Timeout en secondes pour detecter un montage bloque (stale mount)
STALE_TIMEOUT=5

# Notifications macOS natives : true ou false
NOTIFICATIONS_ENABLED=true

# Webhook Home Assistant optionnel (POST JSON a chaque evenement)
# Laisser vide pour desactiver. Exemple : "http://homeassistant.local:8123/api/webhook/smb_guardian"
HA_WEBHOOK_URL=""

# Fichier de log du script (rotation manuelle, voir README)
LOG_FILE="$HOME/Library/Logs/smb-guardian.log"
